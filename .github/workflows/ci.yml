# Baysöz Labs <baysozlabs@proton.me> — archivebound continuous integration.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
      - name: Install environment
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest ruff semgrep
      - name: Tests
        run: uv run pytest -q
      - name: Ruff
        run: uv run ruff check --select E,F,W,S,B .
      - name: Semgrep
        run: uv run semgrep --config p/default --error .
      - name: Attribution banner
        run: uv run archivebound --version
